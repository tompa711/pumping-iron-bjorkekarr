<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Träningslogg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>🏋️ Min Träningslogg</h1>

    <!-- ===== PROFIL ===== -->
    <section class="card">
      <h2>Din profil</h2>
      <p class="hint">Används för att räkna ut BMI och ungefärligt kaloriförbrukning per pass. Sparas bara i din egen webbläsare.</p>
      <form id="profile-form" class="form-grid">
        <label>
          Namn
          <input type="text" id="profile-name" placeholder="T.ex. Thomas">
        </label>
        <label>
          Vikt (kg)
          <input type="number" id="profile-weight" min="20" max="300" step="0.1" placeholder="T.ex. 82">
        </label>
        <label>
          Längd (cm)
          <input type="number" id="profile-height" min="100" max="250" step="0.1" placeholder="T.ex. 180">
        </label>
        <button type="submit">Spara profil</button>
      </form>
      <div id="profile-stats" class="stats"></div>
    </section>

    <!-- ===== NYTT PASS ===== -->
    <section class="card">
      <h2>Logga nytt pass</h2>
      <form id="session-form">
        <div class="form-grid">
          <label>
            Datum
            <input type="date" id="session-date" required>
          </label>
          <label>
            Pass-längd (minuter)
            <input type="number" id="session-duration" min="1" max="600" placeholder="T.ex. 60" required>
          </label>
        </div>

        <h3>Övningar i passet</h3>
        <div id="exercise-rows"></div>
        <button type="button" id="add-exercise-row" class="secondary">+ Lägg till övning</button>

        <div class="submit-row">
          <button type="submit">Spara pass</button>
        </div>
      </form>
    </section>

    <!-- ===== HISTORIK ===== -->
    <section class="card">
      <h2>Historik</h2>
      <div id="history"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
