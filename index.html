<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pumping Iron Björkekärr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="poster">
      <div class="poster-row">
        <div class="brand-badge">
          <span>PI</span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Pumping Iron<br>Björkekärr</h1>
          <p class="brand-sub">(och Hisingen) &middot; Träningslogg</p>
        </div>
      </div>
    </header>

    <!-- ===== PROFIL ===== -->
    <section class="card">
      <h2>Din profil</h2>
      <p class="hint">Används för att räkna ut BMI och ungefärligt kaloriförbrukning per pass. Sparas bara i din egen webbläsare.</p>
      <form id="profile-form" class="form-grid">
        <label>
          Namn
          <input type="text" id="profile-name" placeholder="T.ex. Thomas">
        </label>
        <label>
          Vikt (kg)
          <input type="number" id="profile-weight" min="20" max="300" step="0.1" placeholder="T.ex. 82">
        </label>
        <label>
          Längd (cm)
          <input type="number" id="profile-height" min="100" max="250" step="0.1" placeholder="T.ex. 180">
        </label>
        <button type="submit">Spara profil</button>
      </form>
      <div id="profile-stats" class="stats"></div>
    </section>

    <!-- ===== NYTT / REDIGERA PASS ===== -->
    <section class="card">
      <h2 id="session-form-title">Logga nytt pass</h2>
      <form id="session-form">
        <input type="hidden" id="session-editing-id">
        <div class="form-grid">
          <label>
            Passtyp
            <select id="session-type">
              <option value="strength">Styrka</option>
              <option value="running">Löpning</option>
              <option value="walking">Promenad</option>
              <option value="cycling">Cykling</option>
              <option value="elliptical">Crosstrainer</option>
            </select>
          </label>
          <label>
            Datum
            <input type="date" id="session-date" required>
          </label>
          <label>
            Pass-längd (minuter)
            <input type="number" id="session-duration" min="1" max="600" placeholder="T.ex. 60" required>
          </label>
          <label id="pace-label">
            <span id="pace-label-text">Tempo (min/km)</span>
            <input type="number" id="session-pace" min="1" step="0.1" placeholder="T.ex. 5.5">
          </label>
        </div>

        <div id="strength-section">
          <h3>Övningar i passet</h3>
          <div id="exercise-rows"></div>
          <button type="button" id="add-exercise-row" class="secondary">+ Lägg till övning</button>
        </div>

        <div class="submit-row">
          <button type="submit" id="session-submit-btn">Spara pass</button>
          <button type="button" id="cancel-edit-btn" class="secondary" hidden>Avbryt redigering</button>
        </div>
      </form>
    </section>

    <!-- ===== HISTORIK ===== -->
    <section class="card">
      <h2>Historik</h2>
      <div id="history"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
